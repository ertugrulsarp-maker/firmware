name: Build Bruce Custom Board

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-zero-custom

      - name: Locate build output
        run: ls -la .pio/build/esp32-s3-zero-custom/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruce-esp32-s3-zero-custom-bin
          path: |
            .pio/build/esp32-s3-zero-custom/firmware.bin
            .pio/build/esp32-s3-zero-custom/bootloader.bin
            .pio/build/esp32-s3-zero-custom/partitions.bin
          retention-days: 14

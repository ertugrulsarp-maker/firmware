[env:esp32-s3-zero-custom]
extends = env:esp32-s3-devkitc-1
board = esp32-s3-zero-custom
board_build.partitions = custom_4Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-zero-custom>
build_flags =
    ${env.build_flags}
    -Iboards/esp32-s3-zero-custom

    ; ekran ayarları (240x240 IPS SPI)
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DROTATION=1
    -DSMOOTH_FONT=1
    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28

    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=7
    -DBACKLIGHT=7

    ; SPI ortak hat tanımı
    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10

    ; NRF24
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=5
    -DNRF24_SS_PIN=6
    -DNRF24_MOSI_PIN=11
    -DNRF24_SCK_PIN=12
    -DNRF24_MISO_PIN=13

    ; butonlar (Bruce'un native 3-buton modeli)
    -DSEL_BTN=2
    -DUP_BTN=4
    -DDW_BTN=3
    -DBTN_ALIAS='"OK"'

    ; sd kart yok
    -DSDCARD_CS=-1
    -DSDCARD_SCK=-1
    -DSDCARD_MISO=-1
    -DSDCARD_MOSI=-1

    -DDEVICE_NAME='"ESP32-S3-Zero Custom"'

lib_deps =
    ${env.lib_deps}
